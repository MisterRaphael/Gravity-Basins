# ==========================================
# Configuration par défaut - Gravity Basins
# ==========================================

# --- Fenêtre et Rendu ---
WINDOW_WIDTH = 2300
# WINDOW_HEIGHT est calculé en 16:9 automatiquement si omis
FPS = 60

# --- Planètes ---
number_of_planets = 6
PLANET_LAYOUT = random     # random, circle ou saved
PLANET_LAYOUT_FILE = planet_layouts/current.txt

# --- Physique ---
G = 100000.0             # Constante de gravitation
FRICTION_COEFF = 1500 * (WINDOW_WIDTH)**(-1.5) * (number_of_planets / 5)**0.75     # Coefficient de frottement linéaire

# --- Précision de la simulation ---
SOFTENING_SQ = 200.0     # Paramètre adoucisseur epsilon^2 pour éviter les singularités

# --- Tolérances de capture ---
CAPTURATION_TOLERANCE_KINETIC_ENERGY = 150.0       # Énergie cinétique max en Joules
CAPTURATION_TOLERANCE_POSITION_DIFFERENCE = 30.0   # Tolérance en pixels par rapport à la planète

# --- Performance GPU / Rendu ---
GPU_STEPS_PER_DISPATCH = 16                         # Sous-pas physiques simultanés pour chaque pixel GPU

